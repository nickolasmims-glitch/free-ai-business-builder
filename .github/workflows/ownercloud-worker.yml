name: OwnerCloud Worker Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  ownercloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run OwnerCloud worker cycle
        env:
          OWNER_CLOUD_RUN_ID: ${{ github.run_id }}
          AUTOPILOT_TOPIC: Business revenue opportunity research and monetization
          FRIDAY_TARGET_USD: "1000"
          FRIDAY_DEADLINE: "2026-09-25"
          FOUR_MONTH_TARGET_USD: "4000000"
          FOUR_MONTH_DEADLINE: "2027-01-25"
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: node scripts/ownercloud-agent-runner.mjs
