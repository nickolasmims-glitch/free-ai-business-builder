name: External AI2 AI3 Guardian Supervisor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: external-ai2-ai3-guardian
  cancel-in-progress: false

jobs:
  supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Allow the matching Vercel production deployment to become ready
        run: sleep 90

      - name: Trigger Guardian outside Vercel Cron
        env:
          GUARDIAN_URL: https://free-ai-business-builder.vercel.app/api/guardian
        run: |
          set -euo pipefail
          oidc_response="$(curl --fail-with-body --silent --show-error \
            --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=free-ai-business-builder-guardian")"
          OIDC_TOKEN="$(printf '%s' "$oidc_response" | jq -r '.value')"
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "GitHub OIDC token was not issued."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -X POST "$GUARDIAN_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"topic":"AI2 AI3 autonomous revenue mission","command":"Continue the revenue mission. Research, evaluate, and execute every legitimate zero-cost internal step available. Do not spend, transfer, withdraw, invest, purchase, refund, or make financial commitments. Use the standing authorization for legitimate targeted zero-cost outreach only where a compliant delivery channel and verified business basis exist. Record verified progress and blockers."}')"

          echo "$response"
