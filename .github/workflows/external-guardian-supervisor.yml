name: External AI2 AI3 Guardian Supervisor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-ai2-ai3-guardian
  cancel-in-progress: false

jobs:
  supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Guardian outside Vercel Cron
        env:
          GUARDIAN_URL: https://free-ai-business-builder.vercel.app/api/guardian
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions."
            echo "External supervisor is installed but cannot authenticate to Guardian yet."
            exit 1
          fi

          response="$(curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -X POST "$GUARDIAN_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{"topic":"AI2 AI3 autonomous revenue mission","command":"Continue the revenue mission. Research, evaluate, and execute every legitimate zero-cost internal step available. Do not spend, transfer, withdraw, invest, purchase, refund, or make financial commitments. Use the standing authorization for legitimate targeted zero-cost outreach only where a compliant delivery channel and verified business basis exist. Record verified progress and blockers."}')"

          echo "$response"
