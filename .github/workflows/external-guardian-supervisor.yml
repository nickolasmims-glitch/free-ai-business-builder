name: External AI2 AI3 Guardian Supervisor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-ai2-ai3-guardian
  cancel-in-progress: false

jobs:
  supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      AUTOPILOT_REPORT_EMAIL: ${{ secrets.AUTOPILOT_REPORT_EMAIL }}
      AI2_MODEL: openai/gpt-5.6-sol
      AI3_MODEL: openai/gpt-5.6-terra
      AI_FALLBACK_MODEL: openai/gpt-5.6-luna
      AUTOPILOT_TOPIC: AI workflow automation for local service businesses
      FRIDAY_TARGET_USD: "1000"
      FRIDAY_DEADLINE: "2026-09-25"
      FOUR_MONTH_TARGET_USD: "4000000"
      FOUR_MONTH_DEADLINE: "2027-01-25"
      OWNER_LOCKED: "true"
      AUTONOMOUS_SPENDING: "false"
      FINANCIAL_ACTIONS_REQUIRE_OWNER_APPROVAL: "true"
      FABRICATED_REVENUE_FORBIDDEN: "true"
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run AI2 + AI3 Guardian worker
        run: node scripts/guardian-runner.mjs
