name: Vercel Production Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/workflows/vercel-production-deploy.yml"
  workflow_dispatch:

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_Ak2SMLMUQbYABVLFX6xX2yOg
  VERCEL_PROJECT_ID: prj_DZI9eH6QgpI6viOP3RYwTWhKlP7Y

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}" || { echo "Missing GitHub Actions secret VERCEL_TOKEN"; exit 1; }
          vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
