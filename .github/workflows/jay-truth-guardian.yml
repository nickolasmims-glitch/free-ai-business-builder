name: Jay Truth Guardian

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jay:
    name: Jay — Assistant Truth Oversight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JAY_STRICT: "true"
      JAY_EVIDENCE_FILE: /tmp/jay-evidence.json
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build baseline evidence
        shell: bash
        run: |
          cat > "$JAY_EVIDENCE_FILE" <<'JSON'
          {
            "deployment": {
              "status": "UNVERIFIED",
              "evidence": "Jay requires independent deployment evidence for the exact commit."
            },
            "aiWorkers": {
              "status": "UNVERIFIED",
              "evidence": "Jay requires execution evidence explicitly reporting AI_COMPLETE for AI2 and AI3."
            },
            "revenue": {
              "status": "UNVERIFIED",
              "evidence": "Jay requires verified Stripe evidence; no revenue is assumed."
            },
            "codeFix": {
              "status": "VERIFIED",
              "evidence": "The current GitHub commit exists: $GITHUB_SHA"
            },
            "liveApp": {
              "status": "UNVERIFIED",
              "evidence": "A GitHub commit alone does not prove production is live."
            }
          }
          JSON

      - name: Jay truth audit
        run: node scripts/jay-truth-guardian.mjs

      - name: Publish Jay verdict
        if: always()
        run: |
          echo "JAY VERDICT"
          echo "Jay does not convert attempts into success."
          echo "See the Truth Guardian job log for the evidence-backed verdict."
