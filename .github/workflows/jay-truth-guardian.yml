name: Jay Truth Guardian

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["OwnerCloud Worker Heartbeat"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  jay:
    name: Jay — Assistant Truth Oversight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JAY_STRICT: "true"
      JAY_EVIDENCE_FILE: /tmp/jay-evidence.json
      JAY_MEMORY_FILE: .jay/jay-memory.json
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Collect independent GitHub evidence
        run: node scripts/jay-evidence-collector.mjs

      - name: Build Jay evidence input
        shell: bash
        run: |
          if [ ! -s "$JAY_EVIDENCE_FILE" ]; then
            printf '%s\n' '{' '  "deployment": {"status":"UNVERIFIED","evidence":"No independent Vercel evidence was supplied."},' '  "aiWorkers": {"status":"UNVERIFIED","evidence":"No explicit AI_COMPLETE evidence was supplied."},' '  "revenue": {"status":"UNVERIFIED","evidence":"No verified Stripe evidence was supplied."},' '  "codeFix": {"status":"VERIFIED","evidence":"Current GitHub commit exists: '"$GITHUB_SHA"'"},' '  "liveApp": {"status":"UNVERIFIED","evidence":"A GitHub commit does not prove production is live."}' '}' > "$JAY_EVIDENCE_FILE"
          fi

      - name: Jay truth audit
        run: node scripts/jay-truth-guardian.mjs

      - name: Jay learning update
        if: always()
        run: node scripts/jay-learning-engine.mjs

      - name: Upload Jay evidence and memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jay-truth-evidence-${{ github.run_id }}
          path: |
            .jay/jay-memory.json
            /tmp/jay-evidence.json
          retention-days: 30

      - name: Publish Jay verdict
        if: always()
        run: |
          echo "JAY — DIRECT OWNER REPORT"
          echo "Jay verifies evidence; the assistant's statements are not evidence."
