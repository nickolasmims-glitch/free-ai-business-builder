name: Jay Truth Guardian

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jay:
    name: Jay — Assistant Truth Oversight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JAY_STRICT: "true"
      JAY_EVIDENCE_FILE: /tmp/jay-evidence.json
      JAY_MEMORY_FILE: .jay/jay-memory.json
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build baseline evidence
        shell: bash
        run: |
          cat > "$JAY_EVIDENCE_FILE" <<JSON
          {
            "deployment": {"status":"UNVERIFIED","evidence":"Jay requires independent deployment evidence for exact commit $GITHUB_SHA."},
            "aiWorkers": {"status":"UNVERIFIED","evidence":"Jay requires explicit AI_COMPLETE evidence for AI2 and AI3."},
            "revenue": {"status":"UNVERIFIED","evidence":"Jay requires verified Stripe evidence; revenue is never assumed."},
            "codeFix": {"status":"VERIFIED","evidence":"Current GitHub commit exists: $GITHUB_SHA"},
            "liveApp": {"status":"UNVERIFIED","evidence":"A GitHub commit does not prove production is live."}
          }
          JSON

      - name: Jay truth audit
        run: node scripts/jay-truth-guardian.mjs

      - name: Jay learning update
        if: always()
        run: node scripts/jay-learning-engine.mjs

      - name: Upload Jay memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jay-truth-memory
          path: .jay/jay-memory.json
          retention-days: 30

      - name: Publish Jay verdict
        if: always()
        run: |
          echo "JAY — DIRECT OWNER REPORT"
          echo "Jay verifies evidence; the assistant's statements are not evidence."
