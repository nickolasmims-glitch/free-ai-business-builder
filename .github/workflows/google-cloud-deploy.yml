name: Deploy Customer Gateway to Google Cloud

on:
  push:
    branches:
      - ground-up-gateway
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_ACCESS_TOKEN: ${{ secrets.OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for v in PROJECT_ID REGION WIF_PROVIDER SERVICE_ACCOUNT GEMINI_API_KEY OWNER_ACCESS_TOKEN; do
            if [ -z "${!v}" ]; then echo "Missing GitHub Actions secret: $v"; exit 1; fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Test source
        working-directory: gateway
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm test

      - name: Provision Google Cloud resources
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OWNER_ACCESS_TOKEN: ${{ secrets.OWNER_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com cloudbuild.googleapis.com secretmanager.googleapis.com sqladmin.googleapis.com
          gcloud artifacts repositories describe gateway --location="$REGION" >/dev/null 2>&1 || gcloud artifacts repositories create gateway --repository-format=docker --location="$REGION" --description="Customer Gateway"
          gcloud iam service-accounts describe "gateway-runtime@$PROJECT_ID.iam.gserviceaccount.com" >/dev/null 2>&1 || gcloud iam service-accounts create gateway-runtime --display-name="Customer Gateway runtime"
          if ! gcloud sql instances describe customer-gateway-db >/dev/null 2>&1; then
            gcloud sql instances create customer-gateway-db --database-version=POSTGRES_17 --region="$REGION" --tier=db-g1-small --storage-size=20 --storage-auto-increase --backup-start-time=03:00
          fi
          gcloud sql databases describe gateway --instance=customer-gateway-db >/dev/null 2>&1 || gcloud sql databases create gateway --instance=customer-gateway-db
          DB_PASSWORD="$(openssl rand -hex 32)"
          if gcloud sql users list --instance=customer-gateway-db --format="value(name)" | grep -Fxq gateway_app; then
            gcloud sql users set-password gateway_app --instance=customer-gateway-db --password="$DB_PASSWORD"
          else
            gcloud sql users create gateway_app --instance=customer-gateway-db --password="$DB_PASSWORD"
          fi
          CONNECTION_NAME="$(gcloud sql instances describe customer-gateway-db --format="value(connectionName)")"
          DATABASE_URL="postgresql://gateway_app:$DB_PASSWORD@localhost/gateway?host=/cloudsql/$CONNECTION_NAME"
          for secret in gateway-gemini-api-key gateway-database-url gateway-owner-access-token; do
            gcloud secrets describe "$secret" >/dev/null 2>&1 || gcloud secrets create "$secret" --replication-policy=automatic
          done
          printf '%s' "$GEMINI_API_KEY" | gcloud secrets versions add gateway-gemini-api-key --data-file=-
          printf '%s' "$DATABASE_URL" | gcloud secrets versions add gateway-database-url --data-file=-
          printf '%s' "$OWNER_ACCESS_TOKEN" | gcloud secrets versions add gateway-owner-access-token --data-file=-
          RUNTIME_SA="gateway-runtime@$PROJECT_ID.iam.gserviceaccount.com"
          gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="serviceAccount:$RUNTIME_SA" --role=roles/secretmanager.secretAccessor --quiet
          gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="serviceAccount:$RUNTIME_SA" --role=roles/cloudsql.client --quiet
          echo "CONNECTION_NAME=$CONNECTION_NAME" >> "$GITHUB_ENV"
          echo "GEMINI_VERSION=$(gcloud secrets versions list gateway-gemini-api-key --filter=state=ENABLED --sort-by=~createTime --limit=1 --format='value(name.basename())')" >> "$GITHUB_ENV"
          echo "DATABASE_VERSION=$(gcloud secrets versions list gateway-database-url --filter=state=ENABLED --sort-by=~createTime --limit=1 --format='value(name.basename())')" >> "$GITHUB_ENV"
          echo "OWNER_VERSION=$(gcloud secrets versions list gateway-owner-access-token --filter=state=ENABLED --sort-by=~createTime --limit=1 --format='value(name.basename())')" >> "$GITHUB_ENV"

      - name: Build gateway
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud builds submit gateway --tag "$REGION-docker.pkg.dev/$PROJECT_ID/gateway/customer-gateway:$GITHUB_SHA"

      - name: Build AI2 AI3 worker
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud builds submit gateway --config=/dev/stdin <<EOF
          steps:
          - name: gcr.io/cloud-builders/docker
            args: ["build","-f","worker-Dockerfile","-t","$REGION-docker.pkg.dev/$PROJECT_ID/gateway/ai2-ai3-worker:$GITHUB_SHA","."]
          images:
          - "$REGION-docker.pkg.dev/$PROJECT_ID/gateway/ai2-ai3-worker:$GITHUB_SHA"
          EOF

      - name: Deploy gateway
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        working-directory: gateway
        run: |
          set -euo pipefail
          sed -e "s|REGION|$REGION|g" -e "s|PROJECT_ID|$PROJECT_ID|g" -e "s|CLOUDSQL_CONNECTION|$CONNECTION_NAME|g" -e "s|:latest|:$GITHUB_SHA|g" cloudrun-service.yaml > /tmp/gateway.yaml
          gcloud run services replace /tmp/gateway.yaml --region="$REGION"
          gcloud run services update customer-gateway --region="$REGION" --service-account="gateway-runtime@$PROJECT_ID.iam.gserviceaccount.com" --add-cloudsql-instances="$CONNECTION_NAME" --set-secrets="GEMINI_API_KEY=gateway-gemini-api-key:$GEMINI_VERSION,DATABASE_URL=gateway-database-url:$DATABASE_VERSION,OWNER_ACCESS_TOKEN=gateway-owner-access-token:$OWNER_VERSION"

      - name: Deploy AI2 AI3 worker pool
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
        working-directory: gateway
        run: |
          set -euo pipefail
          sed -e "s|REGION|$REGION|g" -e "s|PROJECT_ID|$PROJECT_ID|g" -e "s|CLOUDSQL_CONNECTION|$CONNECTION_NAME|g" -e "s|:latest|:$GITHUB_SHA|g" worker-pool.yaml > /tmp/worker-pool.yaml
          gcloud run worker-pools replace /tmp/worker-pool.yaml --region="$REGION"
          gcloud run worker-pools update ai2-ai3-workers --region="$REGION" --service-account="gateway-runtime@$PROJECT_ID.iam.gserviceaccount.com" --set-cloudsql-instances="$CONNECTION_NAME" --set-secrets="GEMINI_API_KEY=gateway-gemini-api-key:$GEMINI_VERSION,DATABASE_URL=gateway-database-url:$DATABASE_VERSION"

      - name: Verify deployment
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe customer-gateway --region="$REGION" --format='value(status.url)')"
          READY="$(gcloud run services describe customer-gateway --region="$REGION" --format='value(status.latestReadyRevisionName)')"
          WORKER="$(gcloud run worker-pools describe ai2-ai3-workers --region="$REGION" --format='value(status.latestCreatedRevisionName)')"
          test -n "$URL" && test -n "$READY" && test -n "$WORKER"
          echo "Gateway URL: $URL"
          echo "Gateway revision: $READY"
          echo "AI2/AI3 worker revision: $WORKER"
