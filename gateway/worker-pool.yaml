apiVersion: run.googleapis.com/v1
kind: WorkerPool
metadata:
  name: ai2-ai3-workers
spec:
  template:
    containers:
    - image: REGION-docker.pkg.dev/PROJECT_ID/gateway/ai2-ai3-worker:latest
      env:
      - name: GEMINI_MODEL
        value: "gemini-3.8-flash"
      - name: AGENT_INTERVAL_MS
        value: "300000"
