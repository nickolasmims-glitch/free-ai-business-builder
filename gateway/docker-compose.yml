services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATA_FILE: /data/gateway-data.json
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      AI2_INTERVAL_MS: ${AI2_INTERVAL_MS:-60000}
    volumes:
      - gateway_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD","node","-e","fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  gateway_data:
