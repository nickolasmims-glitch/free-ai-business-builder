<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Gateway</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#fff}main{max-width:1000px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#151c32;border:1px solid #2b3655;border-radius:16px;padding:18px}.signal{font-size:42px;font-weight:800}.blink{animation:p 1s infinite}@keyframes p{50%{opacity:.25}}</style></head><body><main><h1>Customer Gateway</h1><p>One customer-facing app. Server-side operations continue when this page is closed.</p><div id="workers" class="grid"></div><h2>LotteryCloud Research Signals</h2><div id="lottery" class="grid"></div></main><script>async function refresh(){const s=await fetch("/api/status").then(r=>r.json());document.querySelector("#workers").innerHTML=Object.entries(s.workers).map(([k,v])=>"<div class='card'><h3>"+k.toUpperCase()+"</h3><div>Runs: "+v.runs+"</div><div>Last run: "+(v.lastRun||"not yet")+"</div><div>Last error: "+(v.lastError||"none")+"</div></div>").join("");const l=s.signals||{};document.querySelector("#lottery").innerHTML=Object.entries(l).map(([k,v])=>"<div class='card'><h3>"+k+"</h3><div class='signal "+(v.blink?"blink":"")+"'>"+v.signal+"/10</div><div>"+v.basis+"</div></div>").join("")}refresh();setInterval(refresh,10000)</script></body></html>
