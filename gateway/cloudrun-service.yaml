apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: customer-gateway
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containers:
      - image: REGION-docker.pkg.dev/PROJECT_ID/gateway/customer-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: GEMINI_MODEL
          value: "gemini-3.8-flash"
        - name: AUTO_BOT_MODE
          value: "true"
